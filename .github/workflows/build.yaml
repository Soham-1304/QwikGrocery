name: Build and Package QwikGrocery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API URL (e.g. https://your-app.onrender.com/api)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuickGroceryApp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality (Analyze)
        run: flutter analyze

      - name: Determine Target API URL
        id: api_config
        run: |
          URL="${{ github.event.inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL }}"
          if [ -n "$URL" ]; then
            echo "Using API URL: $URL"
            echo "DART_DEFINE=--dart-define=API_BASE_URL=$URL" >> $GITHUB_ENV
          else
            echo "No custom API URL specified, using app default."
            echo "DART_DEFINE=" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: flutter build apk --release ${{ env.DART_DEFINE }}

      - name: Build Android Release App Bundle (AAB)
        run: flutter build appbundle --release ${{ env.DART_DEFINE }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: qwikgrocery-release-apk
          path: QuickGroceryApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: qwikgrocery-release-aab
          path: QuickGroceryApp/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (No-codesign Runner)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: QuickGroceryApp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned for CI/CD)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwikgrocery-ios-runner
          path: QuickGroceryApp/build/ios/iphoneos/Runner.app
          if-no-files-found: ignore
          retention-days: 14

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuickGroceryApp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwikgrocery-web-build
          path: QuickGroceryApp/build/web
          if-no-files-found: error
          retention-days: 14
